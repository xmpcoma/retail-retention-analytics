name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # data/raw в репозиторий не кладём, но он и не нужен: тесты считаются по
      # витринам из data/curated, а prepare проверяется на фикстуре.
      - name: установка
        run: pip install -e ".[dev]"

      - name: тесты
        run: pytest -q
